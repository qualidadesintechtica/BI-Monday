<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | BI Validação de Materiais</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/login.css"></head>
<body><main class="login-shell"><section class="login-brand"><span>DataHub de Validação</span><h1>BI Validação de Materiais</h1><p>Indicadores alimentados automaticamente pela Monday via Supabase.</p></section>
<section class="login-card"><h2>Entrar</h2><p>Use sua conta institucional cadastrada.</p><div id="loginMessage" class="auth-message" hidden></div><form id="loginForm">

<button id="loginButton" class="login-button" type="submit">Entrar</button></form></section></main>
