<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BI | Validação de Materiais</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/dashboard.css"></head>
<body><div class="dashboard-shell"><aside class="sidebar"><div class="brand"><small>DataHub</small><strong>Validação de Materiais</strong></div><nav class="nav"><a class="active" href="#">Resumo Executivo</a><a href="#">Operação</a><a href="#">Ajustes</a><a href="#">Equipe</a></nav></aside>
<main class="main"><header class="topbar"><div><h1>Resumo Executivo</h1><div class="meta-row"><span id="statusCarregamento">Carregando...</span><span>Última atualização: <strong id="ultimaAtualizacao">--</strong></span></div></div><div class="user-area"><span>Olá, <strong data-user-name>Usuário</strong></span><button id="logoutButton" class="logout-button">Sair</button></div></header>
<section class="filters"><select id="filtroEsteira"><option value="">Todas as esteiras</option><option value="Jun a Ago/26 (Regular)">Jun a Ago/26 (Regular)</option></select><select id="filtroBloco"></select><select id="filtroStatus"></select><select id="filtroCategoria"></select><select id="filtroGestor"></select><select id="filtroRevisor"></select></section><div class="meta-row"><span id="quantidadeFiltrada">--</span></div>
<section class="kpis"><article class="kpi"><span>Total de UAs</span><strong id="totalUAs">0</strong></article><article class="kpi"><span>Liberadas</span><strong id="liberadas">0</strong></article><article class="kpi"><span>Não liberadas</span><strong id="naoLiberadas">0</strong></article><article class="kpi"><span>Em NQ</span><strong id="emNQ">0</strong></article><article class="kpi"><span>Em ajuste</span><strong id="emAjuste">0</strong></article><article class="kpi"><span>Validadas</span><strong id="validadas">0</strong></article><article class="kpi"><span>Revalidar NQ</span><strong id="revalidarNQ">0</strong></article><article class="kpi"><span>% analisado</span><strong id="percentualAnalisado">0%</strong></article><article class="kpi"><span>% a chegar</span><strong id="percentualAChegar">0%</strong></article></section>
<section class="charts"><article class="chart-card"><h3>Status da validação</h3><div id="graficoStatus" class="chart"></div></article><article class="chart-card"><h3>Materiais por bloco</h3><div id="graficoBloco" class="chart"></div></article></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/dados.js"></script><script src="js/filtros.js"></script><script src="js/kpis.js"></script><script src="js/graficos.js"></script><script src="js/dashboard.js"></script></body></html>
